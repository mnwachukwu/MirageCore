# What a change to the engine is held to.
#
# Core is source-only. It publishes no installers, cuts no releases, and produces nothing
# downloadable — a push, a pull request, or a tag builds every project, runs every suite, and stops
# there. That is the point: Core is the foundation a game is built on, and the thing that ships is
# the game.
#
# The publish projects are still on disk, and UpdateChannelTests still reads them, so removing them
# is a later decision than this one. Nothing here invokes them.

name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- Do the docs still point at things that exist? -------------------------------------------
  #
  # Its own job rather than a step on one of the others: it needs no toolchain setup at all, so it
  # finishes in seconds and says on its own row whether the prose is intact rather than hiding
  # inside a compile log. Folding it into the ubuntu leg of `test` would also have been free — that
  # job already sets up .NET — but then a broken documentation link reports as
  # "Tests (ubuntu-latest) failed", which is exactly the ambiguous status the matrix exists to
  # avoid.
  #
  # Documentation rot is invisible to everything else here. A renamed file or a reorganized
  # document breaks links that nothing compiles and no test covers, and the person who moved the
  # file is the least likely to notice. This is the only check in the repository that reads prose.
  #
  # Runs on ubuntu deliberately. The checker compares path spelling against real directory entries
  # precisely because a Windows or macOS filesystem answers case-insensitively and would let
  # `Docs/Building.md` pass locally while 404ing here and on github.com — but running it on the
  # case-sensitive platform too means the OS itself is a second opinion.
  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # No setup step of any kind. Every GitHub-hosted runner ships Node, and the checker imports
      # nothing outside Node's standard library — no package.json, no install, nothing to keep up
      # to date. This was briefly a .NET file-based program, which read better beside the rest of
      # the codebase but needed setup-dotnet: .NET 10 is not preinstalled, and file-based programs
      # are a .NET 10 feature, so the SDK an image happens to carry cannot be assumed. Thirty
      # seconds of setup to check sixty lines' worth of links was the wrong trade.
      - name: Check every link in the Markdown resolves
        run: node .github/checks/check-doc-links.mjs

      # Numbers rot the same way links do, and the README's seed counts have gone stale twice. The
      # site is written FROM this README by its own stated rule, so a wrong count publishes twice.
      - name: Check the README's seed counts match data/
        run: node .github/checks/check-seed-counts.mjs

      # The same rot, applied to what the README says about the CODEBASE rather than the world. It
      # was already claiming eighteen projects against a solution holding twenty-one — nobody adding
      # a test project rereads Project Structure.
      - name: Check the README's claims about the repository
        run: node .github/checks/check-readme-facts.mjs

      # The build outputs committed to the tree. Neither half of the content pipeline runs off Windows,
      # so the compiled fonts and shader are committed and every platform ships them — which means
      # editing a .spritefont or the .fx changes nothing anybody sees until somebody rebuilds, with no
      # error in between. See docs/architecture.md, "Why compiled content is committed".
      - name: Check the committed content matches its sources
        run: node .github/checks/check-prebuilt-content.mjs

      # Not documentation, but the same kind of rot: a rule no compiler enforces. A global property on
      # an MSBuild Build call forks the configuration and rebuilds the whole dependency graph a second
      # time, concurrently, into the same obj/ — which surfaces as an occasional CS2012 in the release
      # job and passes on rerun. Cheap to check statically, expensive to diagnose from a red run.
      - name: Check no Build target takes a global property
        run: node .github/checks/check-build-graph.mjs

  # ---- Does it work off Windows? ---------------------------------------------------------------
  #
  # The build job below compiles for all three platforms from one Windows runner, which proves they
  # *compile* and nothing more. It never runs a line of code on Linux or macOS.
  #
  # That matters because some of this code only exists on those platforms. `UserPaths` branches three
  # ways on the operating system — Windows known folders, macOS ~/Library, the Linux XDG spec — and
  # `RuntimeInformation.IsOSPlatform` is not something a test can lie about, so on any single machine
  # two of those branches are unreachable. Linux is also case-sensitive, which nothing on a Windows
  # runner can ever surface: every path the persistence and localization loaders build is a place
  # that difference could bite.
  #
  # ALL FIVE suites run here, on all three platforms, and so does a build of the shipped client.
  # Nothing about the client's CODE is Windows-bound: MonoGame.Framework.DesktopGL is cross-platform by
  # design, and no test in Mirage.Client.Shell.Tests constructs a GraphicsDevice or loads an asset.
  #
  # What IS Windows-bound is compiling the CONTENT, for two unrelated reasons — the effect compiler
  # ships no Linux or macOS build, and four of the five spritefonts are drawn from Tahoma. Neither
  # reaches this job: the compiled content is committed to the tree, so no build here compiles any.
  # See docs/architecture.md, "Why compiled content is committed".
  #
  # Windows is in the matrix as well, even though the build job re-runs these. A minute of duplicated
  # work buys a row per platform that either is or is not green, rather than one row that is green
  # and two that a reader has to reason about.
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not hide the others — knowing it is *only* macOS is most of the
      # diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: MirageSourceRemasteredCore

    steps:
      # ⚠ Checked out into a SUBDIRECTORY, with Compass beside it. Mirage.Scripting consumes Compass
      # the way this fleet consumes shared code — a ProjectReference counted back to a sibling checkout —
      # and the default layout puts this repository at the workspace root, which leaves nowhere for a
      # sibling to go and resolves every relative path to nothing. `defaults.run.working-directory` below
      # then puts every step back where it expects to be; action INPUTS are not affected by it, so the
      # two paths handed to actions are spelled out from the workspace root.
      #
      # Compass names no `ref:`, so this builds against its default branch: a break there breaks this.
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: MirageSourceRemasteredCore

      - name: Check out Compass
        uses: actions/checkout@v7
        with:
          repository: mnwachukwu/Compass
          path: Compass

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: MirageSourceRemasteredCore/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('MirageSourceRemasteredCore/**/*.csproj', 'MirageSourceRemasteredCore/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Named individually rather than through Mirage.Test.csproj, so the content build can be turned
      # off for the one suite that would otherwise trigger it. No tool manifests are restored: with
      # EnableMGCBItems off nothing needs mgcb, and nothing here publishes, so vpk is not wanted either.
      # First because it needs no application built: Mirage.Shared, Mirage.Ui and Mirage.Updates
      # reference no server, client or editor, so a break here is a break in what everything else sits on.
      - name: Test — shared
        run: dotnet test tests/src/Mirage.Shared.Tests/Mirage.Shared.Tests.csproj -c Release --nologo

      - name: Test — server
        run: dotnet test tests/src/Mirage.Server.Tests/Mirage.Server.Tests.csproj -c Release --nologo --filter "TestCategory!=Content"

      # The seed held to the engine's rules. Its own step because it exercises no code: it reads the
      # committed world, which is what the generators outside this repository write and nothing else
      # here can reach. A unit run never touches it.
      - name: Check — seed content
        run: dotnet test tests/src/Mirage.Server.Tests/Mirage.Server.Tests.csproj -c Release --nologo --filter "TestCategory=Content"

      - name: Test — server shell
        run: dotnet test tests/src/Mirage.Server.Shell.Tests/Mirage.Server.Shell.Tests.csproj -c Release --nologo

      - name: Test — client core
        run: dotnet test tests/src/Mirage.Client.Core.Tests/Mirage.Client.Core.Tests.csproj -c Release --nologo

      # Nothing special is needed: the client compiles no content, so this suite reaches no native
      # tooling. No test in it builds a GraphicsDevice or loads an asset either.
      - name: Test — client shell
        run: dotnet test tests/src/Mirage.Client.Shell.Tests/Mirage.Client.Shell.Tests.csproj -c Release --nologo

      - name: Test — editor
        run: dotnet test tests/src/Mirage.Editor.Tests/Mirage.Editor.Tests.csproj -c Release --nologo

      # The only suite that reaches outside this repository: it compiles and runs Compass programs
      # through the checkout above.
      - name: Test — scripting
        run: dotnet test tests/src/Mirage.Scripting.Tests/Mirage.Scripting.Tests.csproj -c Release --nologo

      # The suites above reach the client only as a project reference. This builds the SHIPPED thing on
      # each platform — apphost and all — which is the check on what the README promises: that a
      # from-source build needs the .NET SDK and nothing else, on any of the three. It is only true
      # because the compiled content is committed; a build that had to run mgcb would need Tahoma and a
      # Windows effect compiler. Runs last so a failure here reports after the suites, not instead.
      - name: Build the client
        run: dotnet build client/src/Mirage.Client.Shell/Mirage.Client.Shell.csproj -c Release --nologo

  # ---- The whole solution, in Release ----------------------------------------------------------

  build:
    name: Full solution
    runs-on: windows-latest

    defaults:
      run:
        working-directory: MirageSourceRemasteredCore

    steps:
      # ⚠ Checked out into a SUBDIRECTORY, with Compass beside it. Mirage.Scripting consumes Compass
      # the way this fleet consumes shared code — a ProjectReference counted back to a sibling checkout —
      # and the default layout puts this repository at the workspace root, which leaves nowhere for a
      # sibling to go and resolves every relative path to nothing. `defaults.run.working-directory` below
      # then puts every step back where it expects to be; action INPUTS are not affected by it, so the
      # two paths handed to actions are spelled out from the workspace root.
      #
      # Compass names no `ref:`, so this builds against its default branch: a break there breaks this.
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: MirageSourceRemasteredCore

      - name: Check out Compass
        uses: actions/checkout@v7
        with:
          repository: mnwachukwu/Compass
          path: Compass

      # global.json pins 10.0.302 with rollForward: latestFeature, so this installs what the repo
      # asks for rather than whatever the image happens to ship.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: MirageSourceRemasteredCore/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('MirageSourceRemasteredCore/**/*.csproj', 'MirageSourceRemasteredCore/Directory.Build.props', 'MirageSourceRemasteredCore/**/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Two manifests, and the second is not redundant. The root one declares vpk (which does the
      # packaging below) and ilspycmd; client/.config declares mgcb, the MonoGame content builder.
      # The client manifest sets "isRoot": true, which stops the upward search — so a restore at the
      # root never reaches it, and a build without it produces a client with no compiled content.
      - name: Restore tools
        run: |
          dotnet tool restore
          dotnet tool restore --tool-manifest client/.config/dotnet-tools.json

      - name: Restore
        run: dotnet restore Mirage.slnx

      # The tag names the version people will download; Directory.Build.props names the version
      # stamped into the executables and the installers — it feeds AssemblyVersion, FileVersion,
      # InformationalVersion and vpk's --packVersion alike. If those disagree, someone downloads
      # "v1.2.0" and installs something that calls itself 1.0.0, which is the kind of thing nobody
      # notices until a bug report cites a version that was never built.
      #
      # Placed straight after restore rather than after the build: evaluating the project needs the
      # NoTargets SDK that restore just fetched, and failing here costs seconds instead of the full
      # build-and-test pass.
      - name: Check the tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          declared=$(dotnet msbuild publish/Mirage.Publish.csproj -getProperty:Version -v:q | tr -d '[:space:]')
          tagged="${GITHUB_REF_NAME#v}"
          echo "Directory.Build.props says $declared, the tag says $tagged"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Version $declared. Bump MajorVersion/MinorVersion/PatchVersion in Directory.Build.props, or move the tag."
            exit 1
          fi

      # This runs the tests as well as compiling. Mirage.Test.csproj is a solution member whose Build
      # target is TestAll, so a solution build drives all six suites plus the documentation checks and
      # fails if any of them does — the seven exit codes have to concatenate to "0000000". That is the
      # repository's own convention; asking for the tests separately here would just run them twice.
      - name: Build and test
        run: dotnet build Mirage.slnx -c Release --no-restore --nologo
